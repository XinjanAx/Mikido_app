name: torneo_app
description: Gestión integral de torneos deportivos - Club MIKIDO
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # Estado e inyección de dependencias
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^13.2.0

  # Notificaciones locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Reportes
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.6

  # Utilidades
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.7.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  uuid: ^4.4.0
  drift: ^2.34.3
  sqlite3: ^3.5.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  mocktail: ^1.0.4
  drift_dev: ^2.34.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/images/
    - assets/images/logo_negativo.png
    - assets/images/logo_positivo.png
    - assets/images/logo.png
    - assets/images/club_mikido.png
    - assets/images/club_mikido_negativo.png
    - assets/images/club_mikido_positivo.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
